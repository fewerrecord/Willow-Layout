<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Willow Creek order count</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17252d; --paper:#eef2f3; --card:#ffffff; --line:#d3dde1; --muted:#566b75;
  --walk:#1f6f8b; --frz:#4a58b0; --dry:#9a6a1c; --sup:#5f717a; --unk:#8a4b7a; --grn:#3d7a3a; --rose:#b0414f;
  --warn:#a93d0c; --warnbg:#fdeee4; --hit:#17252d; --hittxt:#ffffff; --focus:#1f6f8b;
  --sans:"Barlow",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6eef1; --paper:#0f171b; --card:#172228; --line:#2a3a42; --muted:#93a8b1;
    --walk:#5bb6d4; --frz:#98a5f2; --dry:#dca64f; --sup:#9aabb3; --unk:#d596c4; --grn:#7cc477; --rose:#ef8a96;
    --warn:#ff9f6d; --warnbg:#2e1c11; --hit:#e6eef1; --hittxt:#0f171b; --focus:#5bb6d4;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eef1; --paper:#0f171b; --card:#172228; --line:#2a3a42; --muted:#93a8b1;
  --walk:#5bb6d4; --frz:#98a5f2; --dry:#dca64f; --sup:#9aabb3; --unk:#d596c4; --grn:#7cc477; --rose:#ef8a96;
  --warn:#ff9f6d; --warnbg:#2e1c11; --hit:#e6eef1; --hittxt:#0f171b; --focus:#5bb6d4;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.35;min-height:100%;padding-bottom:84px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--cond);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px}
.sub{font-size:13px;color:var(--muted)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--hit);color:var(--hittxt)}
.prog{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}
.sync{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.linkbtn{border:0;background:none;padding:4px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}

main{padding:6px 10px 20px}
.sec{margin-top:14px}
.sec-h{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 12px}
.sec-h .nm{font-family:var(--cond);font-weight:700;font-size:18px;flex:1}
.sec-h .ct{font-size:13px;color:var(--muted)}
.sec-h .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px}
.sec.closed .chev{transform:rotate(-45deg)}
.sec.closed .rows{display:none}
.note{font-size:13px;color:var(--muted);padding:8px 4px 0}
.rows{margin-top:6px}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto 54px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:9px 8px 9px 10px;margin-top:6px}
.nm2{font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.15}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.meta2{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
.par,.trig,.upc{width:42px;height:26px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-weight:600;font-size:14px;padding:0}
.meta2 label{display:inline-flex;align-items:center;gap:5px}
.cc{display:flex;flex-direction:column;align-items:center;gap:2px}
.mode{border:0;background:none;padding:2px 4px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.eq{font-size:11px;color:var(--muted);min-height:13px}
.meta2 label{display:inline-flex;align-items:center;gap:5px}
.oh{display:flex;align-items:center;gap:2px}
.oh button{width:38px;height:44px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;font-size:22px;line-height:1;font-weight:500}
.oh button:active{background:var(--line)}
.cnt{width:46px;height:44px;text-align:center;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);font-family:var(--cond);font-weight:700;font-size:20px;padding:0}
.cnt::placeholder{color:var(--muted);font-weight:500}
.ord{text-align:center}
.skipb{border:0;background:none;padding:3px 2px;margin-top:2px;font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.row.skipped{opacity:.55}
.row.skipped .ordn{font-size:15px}
.ordn{display:block;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1;min-height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.ord.on .ordn{background:var(--hit);color:var(--hittxt)}
.ordl{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.sum{flex:1;min-width:0}
.sum b{display:block;font-family:var(--cond);font-size:19px}
.sum span{font-size:13px;color:var(--muted)}
.primary{border:0;background:var(--hit);color:var(--hittxt);border-radius:9px;padding:13px 18px;font-weight:600;font-size:16px;flex:none}
.primary[disabled]{opacity:.4}
.secondary{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:12px 16px;font-weight:600;font-size:16px}

#sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet[hidden]{display:none}
#sheet h2{font-family:var(--cond);font-size:26px;margin:0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14.5px;font-weight:500}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14.5px}
.sh-sec{margin-top:16px;font-family:var(--cond);font-weight:700;font-size:16px;color:var(--c)}
.sh-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sh-q{font-family:var(--cond);font-weight:700;font-size:20px;min-width:34px}
.sh-n{flex:1}
.sh-n small{display:block;color:var(--muted);font-size:12.5px}
.sh-p{font-size:14px;color:var(--muted);white-space:nowrap}

.hent{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:10px;padding:0 12px}
.hent summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;flex-direction:column;gap:2px}
.hent summary::-webkit-details-marker{display:none}
.hent summary b{font-family:var(--cond);font-size:17px}
.hent summary span{font-size:13px;color:var(--muted)}
.hbody{padding-bottom:12px}
.dl{align-self:center;font-size:12px;font-weight:600;border-radius:4px;padding:2px 7px;background:var(--line);color:var(--muted);white-space:nowrap}
.dl.up{background:var(--warnbg);color:var(--warn)}
.dl.dn{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.dl.new{background:var(--hit);color:var(--hittxt)}
.sh-line.gone{opacity:.65}

.emg{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14.5px}
.emg input{width:20px;height:20px}
.enote{width:100%;margin:4px 0 6px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:14.5px}
.hent.emerg{border-left:5px solid var(--warn)}
.hent summary b .chip{margin-left:8px}
.addit{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.addit summary{cursor:pointer;font-size:14.5px;font-weight:600;padding:6px 0;list-style:none}
.addit summary::-webkit-details-marker{display:none}
.addform{display:grid;grid-template-columns:1fr 64px 84px;gap:6px;margin-top:6px}
.addform input{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:15px;min-width:0}
.addform .an{grid-column:1/-1}
.addform button{grid-column:1/-1}
.rmb{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;margin-top:2px}

.aform{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.aform label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
.aform input,.aform select{padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:16px;min-width:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.aform input:not([type=checkbox]):not([type=radio]),.aform select{width:100%}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1}
.g-sec{margin-top:16px;border-left:5px solid var(--c);padding-left:8px}
.g-sh,.g-it{display:flex;align-items:center;gap:6px;margin-top:6px}
.g-name{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
.g-sh .g-name b{display:block;font-family:var(--cond);font-size:18px}
.g-name small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
div.g-name{opacity:.7}
.g-mv{width:42px;height:42px;flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;font-size:18px}
.g-mv[disabled]{opacity:.3;cursor:default}
.g-rest{padding:9px 12px;font-size:14px;flex:none}
.danger{color:var(--warn);border-color:var(--warn)}
.danger[disabled],.secondary[disabled]{opacity:.4;cursor:default}
.aform label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.aform input[type=checkbox],.aform input[type=radio]{width:20px;height:20px;padding:0;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.aform label.sw{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:14px;background:var(--card)}
.sw span{width:16px;height:16px;border-radius:50%;display:inline-block}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sync .linkbtn{padding:8px 0 8px 16px;margin:-8px 0;font-size:12px}
.offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.offer[hidden]{display:none}
.offer span{flex:1;min-width:180px}

body.locked>header,body.locked>main,body.locked>.foot,body.locked>#sheet{display:none!important}
body.locked{padding-bottom:0}
#lock{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#lock[hidden]{display:none}
#lock h1{font-size:26px}
.pindots{font-family:var(--cond);font-size:34px;letter-spacing:8px;height:44px;line-height:44px;margin:14px 0 4px;min-width:200px;text-align:center;border-bottom:2px solid var(--line)}
.pinerr{min-height:20px;font-size:14.5px;font-weight:600;color:var(--warn);margin-bottom:10px;text-align:center}
#pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#pad button{height:64px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-family:var(--cond);font-size:28px;font-weight:600}
#pad button:active{background:var(--line)}
#pad .k-del{font-size:18px;font-weight:500}
#pad .k-go{background:var(--hit);color:var(--hittxt);border-color:var(--hit);font-size:18px}
#pad .k-go[disabled]{opacity:.4}
</style>
</head>
<body class="locked">
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockH">
  <h1 id="lockH">Order count</h1>
  <div class="sub">Enter your PIN</div>
  <div class="pindots" id="pinDots" aria-live="polite"></div>
  <div class="pinerr" id="pinErr" role="alert"></div>
  <div id="pad">
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
    <button type="button" data-k="del" class="k-del" aria-label="Delete last digit">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="go" class="k-go" id="pinGo" disabled>Unlock</button>
  </div>
</div>
<header class="top">
  <div class="top-row">
    <div><h1>Order count</h1><div class="sub" id="sub"></div></div>
    <div class="seg" role="group" aria-label="Delivery day">
      <button type="button" data-day="tue" aria-pressed="false">Tuesday</button>
      <button type="button" data-day="sat" aria-pressed="false">Saturday</button>
    </div>
  </div>
  <div class="prog">
    <div class="bar"><i id="barfill"></i></div>
    <span id="progtxt"></span>
    <button type="button" class="linkbtn" id="editGuide">Edit guide</button>
    <button type="button" class="linkbtn" id="hist">History</button>
    <button type="button" class="linkbtn" id="clear">Clear counts</button>
  </div>
  <div class="sync" id="syncs"><span id="syncTxt"></span><button type="button" class="linkbtn" id="lockBtn">Lock</button></div>
  <div class="infobox offer" id="importOffer" hidden><span>Nothing saved on the server yet. Import your orders-export.json?</span><button type="button" class="primary" id="importBtn">Import file</button><button type="button" class="linkbtn" id="importNo">Not now</button></div>
</header>
<main id="list"></main>
<div class="foot">
  <div class="sum"><b id="sumLines">Count items to build your order</b><span id="sumTotal"></span></div>
  <button type="button" class="primary" id="review" disabled>Review order</button>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Order review"></div>

function updRow(i){

function orderLines(){return ITEMS.map(i=>({i,q:ordOf(i)})).filter(x=>x.q>0);}

const HKEY='wc-order-history-v1';
function loadH(){try{const h=JSON.parse(localStorage.getItem(HKEY)||'[]'); return Array.isArray(h)?h:[];}catch(e){return [];}}
function saveH(h){try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,100)));}catch(e){}}
function snapshot(){
  const L=orderLines(); if(!L.length)return;
  const lines=L.map(x=>({id:x.i.id,name:x.i.name,pack:x.i.pack,sec:x.i.sec,q:x.q,price:x.i.price,c:(cntCases(x.i)===null?null:+cntCases(x.i).toFixed(2))}));
  const total=L.reduce((a,x)=>a+x.q*x.i.price,0);
  const all=ITEMS.filter(i=>cntOf(i)!==null).map(i=>({id:i.id,name:i.name,sec:i.sec,c:+cntCases(i).toFixed(2),par:parOf(i),trig:trigOf(i),q:ordOf(i),skip:!!st.skip[i.id]}));
  const sig=lines.map(l=>l.id+':'+l.q).join('|')+'#'+all.map(a=>a.id+':'+a.c+(a.skip?'s':'')).join('|');
  const h=loadH(), now=Date.now();
  const entry={id:String(now),ts:now,day:st.day,sig,total,lines,all};
  let changed=null;
  if(h.length&&h[0].day===st.day&&now-h[0].ts<3*3600e3){ if(h[0].sig!==sig){
    const old=h[0]; entry.id=String(old.id||old.ts); entry.ts=old.ts;
    if(old.emerg)entry.emerg=true; if(old.note)entry.note=old.note;
    const man=(old.lines||[]).filter(l=>l.manual); entry.lines=entry.lines.concat(man); entry.total+=man.reduce((s,l)=>s+l.q*(l.price||0),0);
    h[0]=entry; changed=entry; } }
  else {h.unshift(entry); changed=entry;}
  saveH(h);
  if(changed)pushEntry(changed);
}
function hdate(ts){const d=new Date(ts); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function elabel(e){return e.emerg?'Emergency order':(e.day==='tue'?'Tuesday':'Saturday')+' delivery';}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);}
function mutEntry(eid,fn){
  const h=loadH(), k=h.findIndex(x=>String(x.id||x.ts)===String(eid)); if(k<0)return null;
  fn(h[k]); h[k].total=h[k].lines.reduce((a,l)=>a+l.q*(l.price||0),0);
  saveH(h); pushEntry(h[k]); return h[k];
}
function histText(e){
  let t=`${elabel(e)}, saved ${hdate(e.ts)}, about ${fmt(e.total)}\n${e.note?'Note: '+e.note+'\n':''}\n`;
  e.lines.forEach(l=>{t+=`${l.q} × ${l.name}${l.pack?' ('+l.pack+')':''}${l.manual?' (added by hand)':idTxt(l.id)}\n`;});
  return t;
}
var histOpenId=null;
function openHistory(openId){
  histOpen=true; guideView=null;
  if(typeof openId==='string')histOpenId=openId;
  const h=loadH(), sh=$('#sheet');
  let o=`<h2>Past orders</h2><div class="sub">Saved automatically when you review an order or clear counts.</div>`;
  if(!h.length) o+=`<div class="infobox">Nothing saved yet. Count some items and tap Review order, and it will show up here.</div>`;
  h.forEach((e,k)=>{
    const prev=h[k+1], eid=String(e.id||e.ts);
    const rm=l=>l.manual?`<button type="button" class="rmb" data-hact="rm" data-id="${eid}" data-lid="${esc(l.id)}">remove</button>`:'';
    o+=`<details class="hent${e.emerg?' emerg':''}" data-id="${eid}"${histOpenId===eid?' open':''}><summary><b>${hdate(e.ts)}${e.emerg?'<span class="chip">emergency</span>':''}</b><span>${e.emerg?'':elabel(e)+' · '}${e.lines.length} items ordered${e.all?' · '+e.all.length+' counted':''} · ${fmt(e.total)}</span></summary><div class="hbody">`;
    o+=`<label class="emg"><input type="checkbox" data-hact="emerg" data-id="${eid}"${e.emerg?' checked':''}> Emergency order (outside Tue/Sat)</label>`;
    if(e.emerg) o+=`<input class="enote" data-hact="note" data-id="${eid}" placeholder="What ran out, or why?" maxlength="200" value="${esc(e.note||'')}" aria-label="Why was this an emergency order">`;
    if(prev){
      const pm={}; prev.lines.forEach(l=>pm[l.id]=l);
      const cm={}; e.lines.forEach(l=>cm[l.id]=l);
      o+=`<div class="sub">Compared with the order before it (${hdate(prev.ts)}, ${fmt(prev.total)}, ${fmt(e.total-prev.total).replace('$-','-$')} difference)</div>`;
      e.lines.forEach(l=>{
        const p=pm[l.id]; const d=p?l.q-p.q:null;
        const tag=p===undefined?'<span class="dl new">new</span>':(d===0?'<span class="dl">same</span>':`<span class="dl ${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>`);
        o+=`<div class="sh-line"><div class="sh-q">${l.q}</div><div class="sh-n">${esc(l.name)}<small>${l.manual?'added by hand · ':''}${p?'before: '+p.q:'not on the earlier order'}${l.c!==null&&l.c!==undefined?' · counted '+l.c+' case':''}</small>${rm(l)}</div>${tag}</div>`;
      });
      prev.lines.filter(l=>!cm[l.id]).forEach(l=>{
        o+=`<div class="sh-line gone"><div class="sh-q">0</div><div class="sh-n">${esc(l.name)}<small>before: ${l.q}</small></div><span class="dl dn">-${l.q}</span></div>`;
      });
    } else {
      e.lines.forEach(l=>{o+=`<div class="sh-line"><div class="sh-q">${l.q}</div><div class="sh-n">${esc(l.name)}<small>${l.manual?'added by hand':esc(l.pack)+(l.pack&&idTxt(l.id)?' · ':'')+idTxt(l.id).trim()}${l.c!==null&&l.c!==undefined?' · counted '+l.c+' case':''}</small>${rm(l)}</div><div class="sh-p">${fmt2(l.q*(l.price||0))}</div></div>`;});
    }
    o+=`<details class="addit"><summary>＋ Add an item we ordered</summary><div class="addform"><input class="an" placeholder="Item name, e.g. dissolvable labels" maxlength="80" aria-label="Item name"><input class="aq" inputmode="decimal" placeholder="cases" value="1" aria-label="Cases ordered"><input class="ap" inputmode="decimal" placeholder="$ per case" aria-label="Price per case"><button type="button" class="secondary" data-hact="add" data-id="${eid}">Add</button></div></details>`;
    o+=`<div class="actions"><button type="button" class="secondary" data-hact="copy" data-id="${eid}">Copy list</button><button type="button" class="secondary" data-hact="del" data-id="${eid}">Delete</button></div></div></details>`;
  });
  o+=`<div class="sh-sec" style="--c:var(--muted)">Export for review</div><div class="sub">Every saved order as a spreadsheet: one row per item with the count, par, reorder level, what was ordered and the price. Good for spotting patterns with Claude.</div>`;
  o+=`<div class="actions" style="margin-top:10px"><button type="button" class="secondary" id="csvDown"${h.length?'':' disabled'}>Export order history (CSV)</button></div>`;
  o+=`<div class="sh-sec" style="--c:var(--muted)">Backup</div><div class="sub">Counts, pars, the guide and every saved order, in one file.</div>`;
  o+=`<div class="actions" style="margin-top:10px"><button type="button" class="secondary" id="bkDown">Download backup (JSON)</button><button type="button" class="secondary" id="bkUp">Restore from JSON</button></div>`;
  o+=`<div class="actions"><button type="button" class="primary" id="hClose">Back to count</button></div>`;
  sh.innerHTML=o; sh.hidden=false; if(typeof openId!=='string'||!histOpenId)sh.scrollTop=0;
  $('#bkDown').onclick=downloadBackup;
  $('#csvDown').onclick=exportHistoryCSV;
  $('#bkUp').onclick=()=>{
    const b=$('#bkUp');
    if(!b._armed){b._armed=true; b.textContent='Tap again: replaces everything'; setTimeout(()=>{b._armed=false;b.textContent='Restore from JSON';},4000); return;}
    b._armed=false; b.textContent='Restore from JSON';
    pickJSON(async o=>{ if(await restoreBackup(o)){histOpenId=null; openHistory('');} });
  };
  sh.querySelectorAll('details.hent').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open)histOpenId=d.dataset.id; else if(histOpenId===d.dataset.id)histOpenId=null; }));
  $('#hClose').onclick=()=>{histOpen=false;sh.hidden=true;};
  sh.onclick=ev=>{
    const b=ev.target.closest('button[data-hact]'); if(!b)return;
    const act=b.dataset.hact, eid=b.dataset.id, cur=loadH(), e=cur.find(x=>String(x.id||x.ts)===eid); if(!e)return;
    if(act==='del'){
      if(!b._armed){b._armed=true; b.textContent='Tap again to delete'; setTimeout(()=>{b._armed=false;b.textContent='Delete';},3000); return;}
      saveH(cur.filter(x=>x!==e)); delEntry(e); histOpenId=null; openHistory(''); return;
    }
    if(act==='rm'){ mutEntry(eid,x=>{x.lines=x.lines.filter(l=>l.id!==b.dataset.lid);}); openHistory(eid); return; }
    if(act==='add'){
      const f=b.closest('.addform'), name=f.querySelector('.an').value.trim(); if(!name){f.querySelector('.an').focus();return;}
      const q=num(f.querySelector('.aq').value)||1, price=num(f.querySelector('.ap').value)||0;
      mutEntry(eid,x=>{x.lines.push({id:'m-'+slug(name),name,pack:'',q,price,c:null,manual:true});});
      openHistory(eid); return;
    }
    if(act==='copy'){
      const text=histText(e);
      const done=()=>{b.textContent='Copied'; setTimeout(()=>{b.textContent='Copy list';},2000);};
      const fb=()=>{const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(er){b.textContent='Copy failed';} document.body.removeChild(ta);};
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fb); else fb();
    }
  };
  sh.onchange=ev=>{
    const el=ev.target; if(!el.dataset||!el.dataset.hact)return;
    if(el.dataset.hact==='emerg'){ mutEntry(el.dataset.id,x=>{x.emerg=el.checked; if(!el.checked)delete x.note;}); openHistory(el.dataset.id); }
    if(el.dataset.hact==='note'){ mutEntry(el.dataset.id,x=>{x.note=el.value.trim().slice(0,200);}); }
  };
}

  try{
    const [s,h]=await Promise.all([
      sb.from('order_state').select('data').eq('owner',DB.uid).maybeSingle(),
      sb.from('order_history').select('data').order('ts',{ascending:false}).limit(100)
    ]);
    if(s.error||h.error)throw (s.error||h.error);
    if(!DB)return;
    const remoteH=(h.data||[]).map(r=>JSON.parse(JSON.stringify(r.data)));
    const remoteS=s.data&&s.data.data?JSON.parse(JSON.stringify(s.data.data)):null;
    if(firstLoad){
      firstLoad=false;
      if(!remoteS&&!remoteH.length&&!loadH().length&&!Object.keys(st.cnt).length&&!Object.keys(st.par).length)showImportOffer();
      // Seed remote history from this device only when the server has none.
      if(!remoteH.length)loadH().forEach(pushEntry);
    }
    applyHistory(remoteH);
    onRemoteState(remoteS);
    retryPending();
  }catch(e){setSync('err');}
}
function showImportOffer(){
  const b=$('#importOffer'); b.hidden=false;
  $('#importBtn').onclick=()=>pickJSON(async o=>{ if(await restoreBackup(o))b.hidden=true; });
  $('#importNo').onclick=()=>{b.hidden=true;};
}
function startSync(uid){
  DB={uid}; setSync('pending');
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('orders-'+uid)
    .on('postgres_changes',{event:'*',schema:'public',table:'order_state',filter:'owner=eq.'+uid},p=>{ if(p.new&&p.new.data)onRemoteState(JSON.parse(JSON.stringify(p.new.data))); })
    .on('postgres_changes',{event:'*',schema:'public',table:'order_history',filter:'owner=eq.'+uid},onHistoryEvent)
    .subscribe(status=>{ if(status==='SUBSCRIBED')loadRemote(); else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setSync('err'); });
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&DB)loadRemote(); });
window.addEventListener('online',()=>{ if(DB){ loadRemote(); if(!synced)scheduleSync(); } });

/* ---------- PIN lock ---------- */
var pin='', busy=false;
function showLock(msg){
  document.body.classList.add('locked'); $('#lock').hidden=false;
  pin=''; drawPin(); $('#pinErr').textContent=msg||'';
}
function drawPin(){ $('#pinDots').textContent=pin?'•'.repeat(pin.length):''; $('#pinGo').disabled=!pin||busy; }
function unlocked(user){
  $('#lock').hidden=true; document.body.classList.remove('locked');
  if(!started){started=true; render();}
  startSync(user.id);
}
async function tryPin(){
  if(!pin||busy)return;
  if(!sb){$('#pinErr').textContent='Could not load the sign-in library. Check your connection and reload.';return;}
  busy=true; drawPin(); $('#pinErr').textContent='Checking…';
  let res;
  try{res=await sb.auth.signInWithPassword({email:OWNER_EMAIL,password:pin});}catch(e){res={error:e,data:{}};}
  busy=false;
  const error=res.error, session=res.data&&res.data.session;
  if(error||!session){
    const net=!navigator.onLine||/fetch|network/i.test(error&&error.message||'');
    pin=''; drawPin();
    $('#pinErr').textContent=net?'Can’t reach the server. Check your connection.':(error&&error.status===429?'Too many tries. Wait a minute and try again.':'Wrong PIN');
    return;
  }
  pin=''; drawPin(); $('#pinErr').textContent='';
  unlocked(session.user);
}
$('#pad').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||busy)return;
  if(b.dataset.k==='del')pin=pin.slice(0,-1); else if(b.dataset.k==='go'){tryPin();return;} else if(pin.length<12)pin+=b.dataset.k;
  $('#pinErr').textContent=''; drawPin();
});
document.addEventListener('keydown',e=>{
  if($('#lock').hidden||busy)return;
  if(/^[0-9]$/.test(e.key)&&pin.length<12){pin+=e.key; $('#pinErr').textContent=''; drawPin();}
  else if(e.key==='Backspace'){pin=pin.slice(0,-1); drawPin();}
  else if(e.key==='Enter')tryPin();
});
let lockArm=false, lockT;
$('#lockBtn').addEventListener('click',async()=>{
  const b=$('#lockBtn');
  if(!synced&&!lockArm){lockArm=true; b.textContent='Not synced yet. Tap again to lock'; lockT=setTimeout(()=>{lockArm=false;b.textContent='Lock';},4000); return;}
  clearTimeout(lockT);
  if(chan){sb.removeChannel(chan); chan=null;}
  DB=null;
  try{await sb.auth.signOut();}catch(e){}
  // Locking also wipes this device's cached counts and history so nothing shows until the PIN is entered again.
  try{localStorage.removeItem(KEY); localStorage.removeItem(HKEY);}catch(e){}
  location.reload();
});
(async function initAuth(){
  if(!sb){showLock('Could not load the sign-in library. Check your connection and reload.');return;}
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='SIGNED_OUT'&&started&&!session&&DB){ if(chan){sb.removeChannel(chan);chan=null;} DB=null; setSync('none'); showLock('Signed out. Enter your PIN.'); } });
  const {data}=await sb.auth.getSession();
  if(data&&data.session)unlocked(data.session.user); else showLock();
})();
</script>
